<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>AI Student Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
    .container { width: 100%; max-width: 820px; }
    h1 { text-align: center; margin-bottom: 15px; color: #38bdf8; font-size: 22px; }
    #chat { background: #1e293b; border-radius: 12px; padding: 20px;
            height: 65vh; overflow-y: auto; margin-bottom: 15px; }
    .msg { margin: 10px 0; padding: 12px 16px; border-radius: 10px; max-width: 85%;
           line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; }
    .user { background: #0ea5e9; color: white; margin-left: auto; }
    .ai { background: #334155; color: #e2e8f0; }
    .err { background: #7f1d1d; }
    .input-box { display: flex; gap: 10px; }
    input { flex: 1; padding: 14px; border-radius: 10px; border: none;
            background: #1e293b; color: white; font-size: 15px; outline: none; }
    button { padding: 14px 24px; background: #38bdf8; color: #0f172a;
             border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0ea5e9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .loading { color: #94a3b8; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎓 AI Student Assistant</h1>
    <div id="chat">
      <div class="msg ai">আসসালামু আলাইকুম! Student database সম্পর্কে যেকোনো প্রশ্ন করুন। যেমন:
• "Morning shift এর সব student কে কে?"
• "যাদের blood group O+ তাদের নাম বলো"
• "Semester 3 এ কতজন student?"
• "Roll 101 এর details দাও"
• "সব female student দের list দাও"</div>
    </div>
    <div class="input-box">
      <input id="q" placeholder="তোমার প্রশ্ন লিখো..." autofocus/>
      <button id="btn" onclick="send()">পাঠাও</button>
    </div>
  </div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('q');
const btn = document.getElementById('btn');

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send() {
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, 'user');
  input.value = '';
  btn.disabled = true;
  const loading = addMsg('চিন্তা করছি...', 'ai loading');

  try {
    const res = await fetch('/ai/ask/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });
    const data = await res.json();
    loading.classList.remove('loading');
    if (data.success) {
      loading.textContent = data.answer;
    } else {
      loading.classList.add('err');
      loading.textContent = data.answer || 'Error';
    }
  } catch (e) {
    loading.classList.remove('loading');
    loading.classList.add('err');
    loading.textContent = 'Network error: ' + e.message;
  } finally {
    btn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    input.focus();
  }
}

input.addEventListener('keypress', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
